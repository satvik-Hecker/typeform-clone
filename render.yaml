services:
  - type: web
    name: typeform-clone-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./typeform.db
      # If you ever redeploy this to a different Vercel URL, update this (and/or the
      # matching default in app/config.py) — this value in the Render dashboard always
      # wins over that code default.
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://typeform-clone-liard.vercel.app
