services:
  - type: web
    name: typeform-clone-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./typeform.db
      # Set this to your deployed frontend's origin (e.g. https://your-app.vercel.app)
      # once you know it — Render will prompt for a value when you deploy this blueprint.
      - key: CORS_ORIGINS
        sync: false
